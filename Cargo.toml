[package]
name = "grompt"
version = "0.7.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
git2 = "0.20"
owo-colors = "4.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
xdg = "3.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "grompt"
path = "src/lib.rs"

[[bin]]
name = "grompt"
path = "src/bin.rs"
